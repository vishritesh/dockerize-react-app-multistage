# Nginx configuration for React app
# This configuration serves the compiled React app and handles SPA routing

server {
    # Listen on port 80 (HTTP)
    listen 80;
    
    # Server name - can be domain or leave as is for any
    server_name _;
    
    # Root directory where React build files are located
    root /usr/share/nginx/html;
    
    # Default file to serve
    index index.html index.htm;
    
    # Main location block
    location / {
        # Try to serve the file/directory, if not found serve index.html
        # This is crucial for React Router to work properly
        try_files $uri $uri/ /index.html;
        
        # Add cache control headers
        expires -1;
        add_header Cache-Control "public, max-age=0";
    }
    
    # Cache static assets for a long time (CSS, JS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
